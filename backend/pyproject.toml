[project]
name = "financial-report-agent-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for a financial industry report writing agent assistant."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "psycopg[binary]==3.2.3",
  "redis==5.2.1",
  "pymilvus==2.5.3",
  "openai==1.59.6",
  "alibabacloud-docmind-api20220711==1.4.14",
  "openpyxl==3.1.5",
  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "tiktoken==0.12.0",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.20",
  "pwdlib[argon2]==0.2.1",
  "PyJWT==2.10.1",
  "alembic==1.14.0",
  "bcrypt==4.2.1",
  "python-jose[cryptography]==3.3.0",
  "setuptools==80.10.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
